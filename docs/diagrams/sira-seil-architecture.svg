<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#f2f0ea"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f4efff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#171717" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#65645f"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1769ff"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 48px Arial, sans-serif; fill: #171717; }
      .subtitle { font: 400 23px Arial, sans-serif; fill: #64635e; }
      .h2 { font: 700 25px Arial, sans-serif; fill: #171717; }
      .h3 { font: 700 20px Arial, sans-serif; fill: #171717; }
      .body { font: 400 17px Arial, sans-serif; fill: #5d5b56; }
      .small { font: 600 15px Arial, sans-serif; fill: #6b6964; letter-spacing: .7px; }
      .white { fill: #fff; }
      .line { fill: none; stroke: #65645f; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #8b8983; stroke-width: 2.5; stroke-dasharray: 9 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="url(#bg)"/>
  <text x="90" y="82" class="title">SIRA + SEIL architecture</text>
  <text x="90" y="120" class="subtitle">Two-sided agentic commerce with model reasoning separated from deterministic authority</text>

  <!-- Buyer and seller surfaces -->
  <rect x="90" y="170" width="505" height="155" rx="24" fill="#ffffff" stroke="#b7cdfa" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="145" cy="225" r="25" fill="#1769ff"/>
  <text x="137" y="234" font-family="Arial" font-size="24" font-weight="700" class="white">B</text>
  <text x="190" y="215" class="small" fill="#1769ff">BUYER SIDE</text>
  <text x="190" y="251" class="h2">SIRA buying agent</text>
  <text x="190" y="281" class="body">Needs • research • comparison • approval</text>

  <rect x="1205" y="170" width="505" height="155" rx="24" fill="#ffffff" stroke="#d5c1f7" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1260" cy="225" r="25" fill="#7c3aed"/>
  <text x="1253" y="234" font-family="Arial" font-size="24" font-weight="700" class="white">S</text>
  <text x="1305" y="215" class="small" fill="#7c3aed">SELLER SIDE</text>
  <text x="1305" y="251" class="h2">SEIL selling agent</text>
  <text x="1305" y="281" class="body">Product truth • evidence • buyer response</text>

  <rect x="650" y="175" width="500" height="145" rx="24" fill="#171717" filter="url(#shadow)"/>
  <text x="900" y="220" class="small white" text-anchor="middle">CURRENT PRODUCT INTERFACE</text>
  <text x="900" y="260" class="h2 white" text-anchor="middle">Next.js web application</text>
  <text x="900" y="292" class="body white" text-anchor="middle">Firebase identity • tenant context • human approvals</text>

  <path d="M595 247 L642 247" class="line" style="stroke:#1769ff;marker-end:url(#arrow-blue)"/>
  <path d="M1205 247 L1158 247" class="line" style="stroke:#7c3aed;marker-end:url(#arrow-purple)"/>

  <!-- API / Runtime -->
  <path d="M900 320 L900 374" class="line"/>
  <rect x="210" y="380" width="1380" height="330" rx="30" fill="url(#runtime)" stroke="#b9b6ae" stroke-width="2" filter="url(#shadow)"/>
  <text x="255" y="430" class="small">AGENTIC APPLICATION RUNTIME • FASTAPI</text>

  <rect x="260" y="465" width="405" height="190" rx="20" fill="#fff" stroke="#c9c7c0" stroke-width="2"/>
  <text x="295" y="505" class="h2">Cognitive kernel</text>
  <text x="295" y="542" class="body">Loads identity, mission and durable context</text>
  <text x="295" y="575" class="body">Chooses answer, follow-up or typed tool proposal</text>
  <text x="295" y="608" class="body">One bounded tool batch, then final composition</text>

  <rect x="735" y="465" width="405" height="190" rx="20" fill="#fff" stroke="#c9c7c0" stroke-width="2"/>
  <text x="770" y="505" class="h2">Policy + tool executor</text>
  <text x="770" y="542" class="body">Schema • tenant • role • approval checks</text>
  <text x="770" y="575" class="body">Current-version and idempotency validation</text>
  <text x="770" y="608" class="body">Only deterministic code performs effects</text>

  <rect x="1210" y="465" width="330" height="190" rx="20" fill="#fff7e8" stroke="#ffb33d" stroke-width="2"/>
  <text x="1245" y="505" class="small" fill="#c76d00">AMAZON BEDROCK</text>
  <text x="1245" y="545" class="h2">Nova 2 Lite</text>
  <text x="1245" y="578" class="body">Conversation + tool reasoning</text>
  <text x="1245" y="615" class="h3">Titan Embeddings</text>
  <text x="1245" y="640" class="body">Evidence retrieval vectors</text>

  <path d="M665 560 L727 560" class="line"/>
  <text x="696" y="545" class="small" text-anchor="middle">PROPOSE</text>
  <path d="M665 520 C860 420, 1050 420, 1202 515" class="dash"/>
  <text x="1075" y="430" class="small" text-anchor="middle">CONVERSE / TOOL USE</text>
  <path d="M1210 610 C1165 665, 1125 670, 1080 650" class="dash"/>

  <!-- Cockroach authority -->
  <path d="M935 655 L935 758" class="line"/>
  <rect x="90" y="770" width="1410" height="335" rx="30" fill="#fff" stroke="#f15b4d" stroke-width="3" filter="url(#shadow)"/>
  <rect x="90" y="770" width="1410" height="78" rx="28" fill="#f15b4d"/>
  <rect x="90" y="820" width="1410" height="28" fill="#f15b4d"/>
  <text x="135" y="820" class="h2 white">CockroachDB Cloud on AWS • sole durable workflow and business-state authority</text>

  <rect x="135" y="890" width="295" height="155" rx="18" fill="#fff6f4" stroke="#f2b3ab" stroke-width="2"/>
  <text x="165" y="930" class="h3">Agent memory</text>
  <text x="165" y="963" class="body">Runs • checkpoints</text>
  <text x="165" y="994" class="body">tool activity • summaries</text>

  <rect x="465" y="890" width="295" height="155" rx="18" fill="#fff6f4" stroke="#f2b3ab" stroke-width="2"/>
  <text x="495" y="930" class="h3">Product Evidence + DVI</text>
  <text x="495" y="963" class="body">Versioned buyer-safe truth</text>
  <text x="495" y="994" class="body">vector candidate retrieval</text>

  <rect x="795" y="890" width="295" height="155" rx="18" fill="#fff6f4" stroke="#f2b3ab" stroke-width="2"/>
  <text x="825" y="930" class="h3">Decision integrity</text>
  <text x="825" y="963" class="body">Serializable retries</text>
  <text x="825" y="994" class="body">version validation • RLS</text>

  <rect x="1125" y="890" width="330" height="155" rx="18" fill="#fff6f4" stroke="#f2b3ab" stroke-width="2"/>
  <text x="1155" y="930" class="h3">Safe asynchronous effects</text>
  <text x="1155" y="963" class="body">Outbox • idempotency</text>
  <text x="1155" y="994" class="body">fenced leases • worker recovery</text>

  <!-- MCP operator plane -->
  <rect x="1550" y="785" width="160" height="260" rx="24" fill="#eef8f6" stroke="#53a892" stroke-width="2"/>
  <text x="1630" y="835" class="small" text-anchor="middle" fill="#18745f">OPERATOR</text>
  <text x="1630" y="885" class="h3" text-anchor="middle">CockroachDB</text>
  <text x="1630" y="915" class="h3" text-anchor="middle">Managed MCP</text>
  <text x="1630" y="965" class="body" text-anchor="middle">Inspect</text>
  <text x="1630" y="992" class="body" text-anchor="middle">verify</text>
  <text x="1630" y="1019" class="body" text-anchor="middle">demonstrate</text>
  <path d="M1550 920 L1508 920" class="dash"/>

  <text x="90" y="1160" class="small">TRUST BOUNDARY: THE MODEL PROPOSES • POLICY CODE AUTHORIZES • COCKROACHDB COMMITS</text>
  <text x="1710" y="1160" class="body" text-anchor="end">SIRA + SEIL</text>
</svg>
