services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: sira
      POSTGRES_USER: sira
      POSTGRES_PASSWORD: sira  # pragma: allowlist secret -- local development only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sira -d sira"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - sira_postgres:/var/lib/postgresql/data

volumes:
  sira_postgres:
