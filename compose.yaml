name: sira-seil-cockroach

services:
  cockroach:
    image: cockroachdb/cockroach:v25.4.14
    command:
      - start-single-node
      - --insecure
      - --advertise-addr=cockroach
      - --http-addr=0.0.0.0:8080
      - --store=/cockroach/cockroach-data
    ports:
      - "127.0.0.1:26257:26257"
      - "127.0.0.1:18080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - cockroach sql --insecure --host=localhost:26257 --execute='SELECT 1' >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - cockroach-data:/cockroach/cockroach-data

volumes:
  cockroach-data:

