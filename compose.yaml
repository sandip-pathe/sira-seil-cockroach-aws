x-backend-service: &backend-service
  image: sira-backend:local
  build:
    context: .
    dockerfile: Dockerfile
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 20s

x-database-provisioner: &database-provisioner
  image: postgres:17.6-alpine
  environment:
    PGHOST: postgres
    PGPORT: 5432
    PGUSER: ${POSTGRES_BOOTSTRAP_USER:-sira}
    PGPASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-sira}
    APP_DATABASE: ${SIRA_DATABASE_NAME:-sira}
    TEST_DATABASE: ${SIRA_TEST_DATABASE_NAME:-sira_test}
    OWNER_ROLE: ${SIRA_DB_OWNER_USER:-sira_owner}
    OWNER_PASSWORD: ${SIRA_DB_OWNER_PASSWORD:-change-me}
    RUNTIME_ROLE: ${SIRA_DB_RUNTIME_USER:-sira_runtime}
    RUNTIME_PASSWORD: ${SIRA_DB_RUNTIME_PASSWORD:-change-me}
  volumes:
    - ./infra/postgres/bootstrap.sh:/bootstrap.sh:ro
    - ./infra/postgres/certify-runtime.sh:/certify-runtime.sh:ro
  command: ["sh", "/bootstrap.sh"]

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      # Keep the always-present maintenance database independent of APP_DATABASE so
      # bootstrap can idempotently create a newly configured application database.
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:-sira}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-sira}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'SELECT 1' >/dev/null",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - sira_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-bootstrap:
    <<: *database-provisioner
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *backend-service
    environment:
      DATABASE_ADMIN_URL: ${SIRA_DOCKER_DATABASE_ADMIN_URL:-postgresql+psycopg://sira_owner:change-me@postgres:5432/sira} # pragma: allowlist secret -- local development only
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  postgres-permissions:
    <<: *database-provisioner
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  postgres-certify:
    <<: *database-provisioner
    profiles: ["certify"]
    command: ["sh", "/certify-runtime.sh"]
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-service
    init: true
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEVELOPMENT_FIXTURE_MODE: "true"
      DEMO_RESET_ENABLED: "true"
      PUBLIC_BASE_URL: http://localhost:${SIRA_API_PORT:-8000}
      WEB_BASE_URL: http://localhost:${SIRA_WEB_PORT:-3000}
      DATABASE_URL: ${SIRA_DOCKER_DATABASE_URL:-postgresql+asyncpg://sira_runtime:change-me@postgres:5432/sira} # pragma: allowlist secret -- local development only
      BROWSER_RETURN_SIGNING_KEY: ${BROWSER_RETURN_SIGNING_KEY:-}
      BROWSER_RETURN_TTL_SECONDS: ${BROWSER_RETURN_TTL_SECONDS:-600}
      PRAVA_BASE_URL: ${PRAVA_BASE_URL:-}
      PRAVA_SECRET_KEY: ${PRAVA_SECRET_KEY:-}
      PRAVA_MERCHANT_URL: ${PRAVA_MERCHANT_URL:-}
      PRAVA_CALLBACK_URL: ${PRAVA_CALLBACK_URL:-}
      PRAVA_USER_EMAIL: ${PRAVA_USER_EMAIL:-}
      PRAVA_MERCHANT_COUNTRY: ${PRAVA_MERCHANT_COUNTRY:-US}
      PRAVA_HOSTED_CHECKOUT_HOSTS: ${PRAVA_HOSTED_CHECKOUT_HOSTS:-}
      CONTROLLED_MERCHANT_BASE_URL: ${CONTROLLED_MERCHANT_BASE_URL:-}
      CONTROLLED_MERCHANT_API_KEY: ${CONTROLLED_MERCHANT_API_KEY:-}
      CONTROLLED_MERCHANT_ID: ${CONTROLLED_MERCHANT_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "sira_api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "127.0.0.1:${SIRA_API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); assert data['status'] == 'ok' and data['database'] == 'configured'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      postgres-permissions:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *backend-service
    profiles: ["worker"]
    init: true
    environment:
      DATABASE_URL: ${SIRA_DOCKER_DATABASE_URL:-postgresql+asyncpg://sira_runtime:change-me@postgres:5432/sira} # pragma: allowlist secret -- local development only
      TEMPORAL_ADDRESS: ${DOCKER_TEMPORAL_ADDRESS:-host.docker.internal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-sira-checkout}
      WORKER_ORGANIZATION_IDS: ${WORKER_ORGANIZATION_IDS:-org_consultco}
      PRAVA_BASE_URL: ${PRAVA_BASE_URL:-}
      PRAVA_SECRET_KEY: ${PRAVA_SECRET_KEY:-}
      PRAVA_MERCHANT_URL: ${PRAVA_MERCHANT_URL:-}
      PRAVA_CALLBACK_URL: ${PRAVA_CALLBACK_URL:-}
      PRAVA_HOSTED_CHECKOUT_HOSTS: ${PRAVA_HOSTED_CHECKOUT_HOSTS:-}
      CONTROLLED_MERCHANT_BASE_URL: ${CONTROLLED_MERCHANT_BASE_URL:-}
      CONTROLLED_MERCHANT_API_KEY: ${CONTROLLED_MERCHANT_API_KEY:-}
      CONTROLLED_MERCHANT_ID: ${CONTROLLED_MERCHANT_ID:-}
    command: ["python", "-m", "sira_worker.main"]
    depends_on:
      postgres-permissions:
        condition: service_completed_successfully
    restart: on-failure:3

volumes:
  sira_postgres:
