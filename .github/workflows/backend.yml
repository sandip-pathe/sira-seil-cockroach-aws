name: backend

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: sira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DEVELOPMENT_FIXTURE_MODE: "true"
      DEMO_RESET_ENABLED: "true"
      SIRA_TEST_DATABASE_ADMIN_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sira_test" # pragma: allowlist secret

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.1"

      - name: Install locked dependencies
        run: |
          corepack enable
          uv sync --all-extras --frozen
          pnpm install --frozen-lockfile

      - name: Check Python
        run: |
          uv run --frozen ruff check python services tests scripts
          uv run --frozen ruff format --check python services tests scripts
          uv run --frozen mypy python services

      - name: Test backend with PostgreSQL
        run: uv run --frozen pytest -q

      - name: Check frozen contracts
        run: |
          uv run --frozen python scripts/generate_openapi.py --check
          pnpm typecheck:client
          pnpm check:client
          pnpm format:check

      - name: Scan current tree for credentials
        run: uv run --frozen python scripts/credential_scan.py --current-tree-only
