name: backend

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: sira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DEVELOPMENT_FIXTURE_MODE: "true"
      DEMO_RESET_ENABLED: "true"
      SIRA_TEST_DATABASE_ADMIN_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sira_test" # pragma: allowlist secret

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.1"

      - name: Install locked dependencies
        run: |
          corepack enable
          uv sync --all-extras --frozen
          pnpm install --frozen-lockfile

      - name: Check Python
        run: |
          uv run --frozen ruff check python services tests scripts
          uv run --frozen ruff format --check python services tests scripts
          uv run --frozen mypy python services

      - name: Test backend with PostgreSQL
        run: uv run --frozen pytest -q

      - name: Check frozen contracts
        run: |
          uv run --frozen python scripts/generate_openapi.py --check
          pnpm typecheck:client
          pnpm check:client
          pnpm format:check

      - name: Scan current tree for credentials
        run: uv run --frozen python scripts/credential_scan.py --current-tree-only

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Compose
        run: |
          docker compose config --quiet
          sh -n infra/postgres/bootstrap.sh
          sh -n infra/postgres/certify-runtime.sh

      - name: Build backend image
        run: docker compose build api

      - name: Build immutable proof adapters and router
        run: docker compose -f infra/datahub/k0/compose.runtime.yaml build

      - name: Start fresh PostgreSQL and restricted API
        env:
          POSTGRES_PORT: "55432"
          SIRA_API_PORT: "18000"
        run: |
          docker compose -p sira-ci up -d --wait api
          health="$(curl --fail --silent http://127.0.0.1:18000/health)"
          test "$(jq -r '.status + ":" + .database' <<<"$health")" = "ok:configured"
          test "$(docker compose -p sira-ci exec -T postgres psql -U sira -d postgres -Atc \
            "SELECT rolsuper::text || ':' || rolbypassrls::text FROM pg_roles WHERE rolname='sira_runtime'")" = "false:false"
          test "$(docker compose -p sira-ci exec -T postgres psql -U sira -d sira -Atc \
            "SELECT version_num FROM alembic_version")" = "f8c1d2e3a4b5"
          docker compose -p sira-ci --profile certify run --rm --no-deps postgres-certify

      - name: Show container logs
        if: always()
        env:
          POSTGRES_PORT: "55432"
          SIRA_API_PORT: "18000"
        run: docker compose -p sira-ci logs --no-color

      - name: Remove isolated Docker test project
        if: always()
        env:
          POSTGRES_PORT: "55432"
          SIRA_API_PORT: "18000"
        run: docker compose -p sira-ci down --volumes --remove-orphans
