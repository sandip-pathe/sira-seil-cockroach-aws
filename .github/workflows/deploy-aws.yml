name: Deploy AWS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws-hackathon
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2.1
        with:
          enable-cache: true

      - name: Install locked Python environment
        run: uv sync --frozen

      - name: Verify infrastructure
        run: |
          pnpm --dir infra/aws build
          pnpm --dir infra/aws test

      - name: Exchange GitHub OIDC token for AWS session
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: sira-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify deployment configuration
        run: uv run python scripts/deployment_preflight.py --stage hackathon --region "${{ vars.AWS_REGION }}"

      - name: Deploy exact stack
        run: >-
          pnpm --dir infra/aws exec cdk deploy Sira-hackathon
          --require-approval never
          --outputs-file cdk-outputs.json

      - name: Publish sanitized deployment summary
        run: |
          node -e "const o=require('./cdk-outputs.json'); const s=o['Sira-hackathon']; console.log(JSON.stringify({application_url:s.ApplicationUrl,commit:process.env.GITHUB_SHA},null,2))"
